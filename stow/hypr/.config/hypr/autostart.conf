# Extra autostart processes

# Run the per-device startup script (scripts/silver-fox or scripts/rainbow-cat)
exec-once = ~/me/os/scripts/$(hostname)/startup.sh

# Auto-mount USB drives on plug-in (mounts under /run/media/$USER)
exec-once = uwsm app -- udiskie --no-tray

# exec-once = uwsm app -- my-service
